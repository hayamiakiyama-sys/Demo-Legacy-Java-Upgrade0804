# Monthly closing / billing settings.
# The discount rule is instantiated reflectively at runtime.
billing.discount.plugin=org.springframework.samples.petclinic.service.billing.WeekdayDiscountPlugin

# Two-digit years in imported visit dates are interpreted relative to this year.
billing.two.digit.year.start=1980

# Directory used for CSV exports and closing snapshots.
# Empty means the platform temporary directory.
billing.export.dir=
